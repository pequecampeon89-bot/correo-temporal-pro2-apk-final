name: Recuperar Worker PRO2

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del Worker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/javascript" \
            "https://api.cloudflare.com/client/v4/accounts/991054296acc2fcda9b41a3cd858126e/workers/scripts/lingering-thunder-52c8/content/v2" \
            -o worker-source.js

      - name: Guardar código recuperado
        uses: actions/upload-artifact@v4
        with:
          name: worker-source-pro2
          path: worker-source.js
